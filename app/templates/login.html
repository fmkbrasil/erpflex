<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · {{ app_name }}</title><link rel="stylesheet" href="/static/style.css?v=13"></head>
<body class="login-body"><form method="post" class="login-card"><h1>{{ app_name }}</h1><p>Núcleo central · acesso por usuário e perfil</p>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<label>Usuário<input name="user" autocomplete="username" required></label><label>Senha<input type="password" name="password" autocomplete="current-password" required></label><button class="btn primary" type="submit">Entrar</button></form></body></html>
