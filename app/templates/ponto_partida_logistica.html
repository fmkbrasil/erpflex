{% extends 'base.html' %}{% block title %}Ponto de partida · {{ app_name }}{% endblock %}{% block content %}
<section class="hero"><div><h1>Ponto de partida da logística</h1><p>Origem utilizada na otimização e cálculo da sequência dos roteiros.</p></div><a class="btn" href="/logistica/inicio">Voltar</a></section>
<section class="panel"><form method="post" class="form-grid wide"><label>Nome<input name="name" value="{{ point.name or '' if point else '' }}" placeholder="Ex.: Lebanon Matriz"></label><label class="span-2">Endereço<input name="address" value="{{ point.address or '' if point else '' }}"></label><label>Cidade<input name="city" value="{{ point.city or '' if point else '' }}"></label><label>UF<input name="state" maxlength="2" value="{{ point.state or '' if point else '' }}"></label><label>CEP<input name="zip_code" value="{{ point.zip_code or '' if point else '' }}"></label><label>Latitude<input name="latitude" value="{{ point.latitude if point and point.latitude is not none else '' }}"></label><label>Longitude<input name="longitude" value="{{ point.longitude if point and point.longitude is not none else '' }}"></label><div class="actions span-2"><button class="btn primary">Salvar ponto de partida</button></div></form></section>
{% endblock %}
