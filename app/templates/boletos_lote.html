<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Boletos em lote</title><style>body{margin:0;background:#eee;font-family:Arial,sans-serif}.toolbar{position:sticky;top:0;background:#fff;padding:12px;border-bottom:1px solid #ccc;z-index:10}.sheet{background:#fff;margin:16px auto;max-width:980px;box-shadow:0 1px 8px #bbb}.sheet iframe{width:100%;height:1120px;border:0}.empty{padding:40px;text-align:center}@media print{body{background:#fff}.toolbar{display:none}.sheet{margin:0;box-shadow:none;page-break-after:always}.sheet:last-child{page-break-after:auto}.sheet iframe{height:1050px}}</style></head><body>
<div class="toolbar"><b>{{pages|length}} boleto(s) preparado(s)</b>{% if failed %} · {{failed}} não puderam ser carregados/pagos{% endif %} <button onclick="window.print()">Imprimir todos</button></div>
{% for item in pages %}<section class="sheet"><iframe srcdoc="{{item.html|e}}" title="Boleto {{item.title.erpflex_id}}"></iframe></section>{% else %}<div class="empty">Nenhum boleto disponível para impressão.</div>{% endfor %}
</body></html>
